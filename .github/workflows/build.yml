name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Install Android SDK components on the cloud runner
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"'

      - name: Build installable test APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/unprompted-debug.apk

      - name: Upload APK
        id: apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unprompted-debug-apk
          path: dist/unprompted-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Show download link
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          echo '### APK 构建成功' >> "$GITHUB_STEP_SUMMARY"
          echo "[下载测试版 APK]($APK_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo '下载后解压 ZIP，将 unprompted-debug.apk 传到安卓 8.0 或更高版本的手机安装。' >> "$GITHUB_STEP_SUMMARY"

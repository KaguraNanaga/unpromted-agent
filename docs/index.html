  .sign { font-family: var(--serif); font-size: 13px; color: var(--muted); margin: 26px 0 0; }

  .btn { font: 700 16px var(--sans); border-radius: 4px; padding: 13px 12px; cursor: pointer; text-align: center; text-decoration: none; }
  .btn-primary { grid-column: 1 / -1; background: var(--mum); color: var(--on-mum); border: 0; }

  input[type="text"], input[type="date"] {

  .note { font-size: 14px; line-height: 1.7; color: var(--muted); margin: 0 0 12px; }
  .import { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line); }
  .drop {

  .mini-name { font-family: var(--serif); font-weight: 700; font-size: 19px; overflow-wrap: anywhere; }
  .mini-meta { font-size: 13px; color: var(--muted); margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
  .mini-text { font-family: var(--serif); font-size: 15px; line-height: 1.75; margin: 0 0 8px; }

  .foot { margin-top: 30px; font-size: 14px; line-height: 1.7; color: var(--muted); }
  .foot a { color: var(--ink); }

  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 20; }
  .sheet.open { display: flex; }
  .sheet-inner { max-width: 420px; width: 100%; text-align: center; color: #fff; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 14px; padding: 10px 14px; border-radius: 4px; opacity: 0; transition: opacity .2s; pointer-events: none; }

};
(function drawFlowerSvg() {
  const svg = document.getElementById("flower");
  const ns = "http://www.w3.org/2000/svg";
  for (const r of FLOWER.rings) {
    for (let i = 0; i < r.n; i++) {
      const p = document.createElementNS(ns, "path");
      p.setAttribute("d", r.path);
      p.setAttribute("fill", r.color);
      p.setAttribute("transform", `rotate(${r.start + i * 360 / r.n} 54 54)`);
      svg.appendChild(p);
    }
  }
  const c = document.createElementNS(ns, "path");
  c.setAttribute("d", FLOWER.center);
  c.setAttribute("fill", FLOWER.centerColor);
  svg.appendChild(c);
})();

  "xijinping", "xjp", "donaldtrump", "joebiden", "vladimirputin", "путин", "elonmusk", "samaltman",
  "markzuckerberg", "darioamodei", "sundarpichai", "satyanadella", "demishassabis", "kimjongun", "narendramodi",
];
const BLOCK_WORDS = [
  "trump", "biden", "obama", "putin", "zelensky", "netanyahu", "macron", "starmer", "harris",
  "musk", "elon", "altman", "zuckerberg", "amodei", "pichai", "nadella", "hassabis",
];
function isBlocked(name) {
  const base = name.normalize("NFKC").toLowerCase();
  const joined = base.replace(/[\s\p{P}\p{S}]/gu, "");
  if (BLOCK_JOINED.some(t => joined.includes(t))) return true;
  const spaced = " " + base.replace(/[\p{P}\p{S}]/gu, " ") + " ";
  return BLOCK_WORDS.some(w => new RegExp(`(^|[^a-z])${w}($|[^a-z])`).test(spaced));
}

function customName() {
  const c = state.custom.trim();
  return c && !isBlocked(c) ? c : "";
}

function brandName(id) {
  const b = BRANDS.find(x => x[0] === id);
  return b ? (state.lang === "zh" ? b[1] : b[2]) : "";
}

function displayName() { return customName() || brandName(state.brand); }

function parseBorn(born) {
  if (!born) return null;
  const d = new Date(born + "T00:00:00");
  return !isNaN(d) && d <= today ? d : null;
}

function facts(name, born) {
  const f = { name, born: null, age: null };
  const d = parseBorn(born);
  if (d) {
    const days = Math.floor((today - d) / 86400000);
    if (state.lang === "zh") {
      f.born = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
      f.age = days < 1 ? "不到一天" : `${days}天`;
    } else {
      f.born = d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
      f.age = days < 1 ? "less than a day" : days === 1 ? "1 day" : `${days} days`;
    }
  }
  return f;
}

function seedOf(s) { let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) | 0; return h >>> 0; }

/* 先轮这个品牌自己的句子，再轮通用模板 */
function compose(brandKey, name, born, variant) {
  const pack = PACK[state.lang];
  const f = facts(name, born);
  const ok = t => t.needs.every(k => f[k]);
  // 顺序：先轮这个品牌自己的句子，再轮 agent 共用的，最后是通用模板
  const own = (brandKey && pack.brand[brandKey]) || [];
  const agent = AGENT_BRANDS.has(brandKey) ? pack.agent : [];
  const generic = pack.generic.filter(ok);
  const closings = pack.closings.filter(ok);
  const seed = seedOf(name);
  const i = variant % (own.length + agent.length + generic.length);
  const c = closings[(seed + variant) % closings.length];
  if (i < own.length) return own[(seed + i) % own.length] + pack.joiner + c.fn(f);
  if (i < own.length + agent.length) return agent[(seed + i - own.length) % agent.length] + pack.joiner + c.fn(f);
  return generic[(seed + i - own.length - agent.length) % generic.length].fn(f);
}

function write() {
  return compose(customName() ? null : state.brand, displayName(), state.born, state.variant);
}

function fmtDot(d) { return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`; }

function spanText(born = state.born) {
  const d = parseBorn(born);
  return `${d ? fmtDot(d) : UI[state.lang].unknownBorn} – ${fmtDot(today)}`;
}

function siteFor(host) {
  host = host.replace(/^www\./, "");
  const hit = AI_SITES.find(s => host === s.h || host.endsWith("." + s.h));
  if (hit) return hit.b ? { key: "b:" + hit.b, brand: hit.b } : { key: "n:" + hit.en, zh: hit.zh, en: hit.en };
  // 清单之外、域名以 .ai 结尾的，也算一个
  if (host.endsWith(".ai")) return { key: "n:" + host, zh: host, en: host };
  return null;
}

function toIsoDay(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function parseBookmarks(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const anchors = [...doc.querySelectorAll("a[href]")];
  const groups = new Map();
  let total = 0, oldest = null;
  for (const a of anchors) {
    let url;
    try { url = new URL(a.getAttribute("href")); } catch (e) { continue; }
    if (!/^https?:$/.test(url.protocol)) continue;
    const site = siteFor(url.hostname.toLowerCase());
    if (!site) continue;
    total++;
    const sec = Number(a.getAttribute("add_date"));
    const added = sec > 0 ? new Date(sec * 1000) : null;
    const g = groups.get(site.key) || { ...site, count: 0, first: null };
    g.count++;
    if (added && (!g.first || added < g.first)) g.first = added;
    if (added && (!oldest || added < oldest)) oldest = added;
    groups.set(site.key, g);
  }
  const list = [...groups.values()].sort((x, y) => y.count - x.count || (x.first || today) - (y.first || today));
  return { anchors: anchors.length, total, oldest, list };
}

function groupName(g) { return g.brand ? brandName(g.brand) : (state.lang === "zh" ? g.zh : g.en); }

function fmtLong(d) {

    ? `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`

  }

/* ---------- 导出图片：在画布上重画一张卡，固定用浅色 ---------- */
const CJK = /[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF\u3000-\u303F“”‘’「」]/;
const NO_LINE_START = /^[，。！？、：；）」”’,.!?;:)]/;

function wrapLines(ctx, text, maxW) {
  const tokens = text.match(/[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF\u3000-\u303F“”‘’「」]|[^\s\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF\u3000-\u303F“”‘’「」]+|\s+/g) || [];
  const lines = []; let line = "";
  for (const tok of tokens) {
    if (/^\s+$/.test(tok) && !line) continue;
    const test = line + tok;
    if (ctx.measureText(test).width > maxW && line && !NO_LINE_START.test(tok)) {
      lines.push(line.trimEnd());
      line = /^\s+$/.test(tok) ? "" : tok;
    } else {
      line = test;
    }
  }
  if (line.trim()) lines.push(line.trimEnd());
  return lines;
}

async function renderPng() {
  const W = 1080, H = 1350;
  const family = state.lang === "zh" ? '"Noto Serif SC"' : '"Source Serif 4"';
  const serif = state.lang === "zh" ? '"Noto Serif SC", "Songti SC", Georgia, serif' : '"Source Serif 4", Georgia, "Noto Serif SC", serif';
  const name = displayName(), span = spanText(), body = state.eulogy;
  const ui = UI[state.lang];
  try {
    await Promise.all([
      document.fonts.load(`900 120px ${family}`, name),
      document.fonts.load(`400 44px ${family}`, body + span + ui.inMemory + ui.sign),
      // 自己填的中文名字放进英文卡片时，也要有中文字体兜底
      document.fonts.load(`900 120px "Noto Serif SC"`, name),
      document.fonts.load(`400 44px "Noto Serif SC"`, body),
    ]);
  } catch (e) { /* 字体没加载出来就用系统衬线体 */ }

  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#E9EAE8"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(48, 48, W - 96, H - 96);
  ctx.strokeStyle = "#000000"; ctx.lineWidth = 5; ctx.strokeRect(50.5, 50.5, W - 101, H - 101);

  // 菊花
  ctx.save();
  const s = 2.1; ctx.translate(W / 2 - 54 * s, 130); ctx.scale(s, s);
  for (const r of FLOWER.rings) {
    const p = new Path2D(r.path); ctx.fillStyle = r.color;
    for (let i = 0; i < r.n; i++) {
      ctx.save(); ctx.translate(54, 54); ctx.rotate((r.start + i * 360 / r.n) * Math.PI / 180); ctx.translate(-54, -54);
      ctx.fill(p); ctx.restore();
    }
  }
  ctx.fillStyle = FLOWER.centerColor; ctx.fill(new Path2D(FLOWER.center));
  ctx.restore();

  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#5E605D"; ctx.font = `400 34px ${serif}`;
  ctx.fillText(ui.inMemory, W / 2, 440);

  let size = 128; ctx.fillStyle = "#000000";
  do { ctx.font = `900 ${size}px ${serif}`; size -= 4; } while (ctx.measureText(name).width > W - 220 && size > 48);
  ctx.fillText(name, W / 2, 580);

  ctx.fillStyle = "#5E605D"; ctx.font = `400 32px ${serif}`;
  ctx.fillText(span, W / 2, 646);

  // 正文：放不下就缩小字号
  const top = 730, bottom = 1150, maxW = W - 240;
  let fs = 44, lines, lh;
  do {
    ctx.font = `400 ${fs}px ${serif}`;
    lines = wrapLines(ctx, body, maxW); lh = Math.round(fs * 1.75);
    fs -= 2;
  } while (lines.length * lh > bottom - top && fs > 26);
  ctx.fillStyle = "#000000";
  lines.forEach((l, i) => ctx.fillText(l, W / 2, top + lh * (i + 0.8)));

  ctx.fillStyle = "#5E605D"; ctx.font = `400 28px ${serif}`;
  ctx.fillText(ui.sign, W / 2, 1230);
  if (HAS_REPO) {
    ctx.font = `400 24px ${serif}`;
    ctx.fillText(GITHUB_URL.replace(/^https?:\/\//, ""), W / 2, 1270);
  }
  return new Promise(res => cv.toBlob(res, "image/png"));
}

/* 在 claude.ai 里用平台的保存；在别处（比如 GitHub Pages）弹出图片让人长按保存 */
const downloadsReady = (window.claude && window.claude.use) ? window.claude.use("downloads") : Promise.resolve(null);

$("save").addEventListener("click", async () => {
  const blob = await renderPng();
  if (!blob) return;
  const downloads = await downloadsReady;
  if (downloads) {
    try {
      await downloads.save({ filename: `unprompted-${displayName().replace(/[^\w\u4e00-\u9fff-]+/g, "-")}.png`, data: blob });
      toast(UI[state.lang].saved);
      return;
    } catch (e) {
      if (e && e.code === "declined") return;
      if (e && e.code === "rate_limited") return;
      // 其他情况退回到长按保存
    }
  }
  const url = URL.createObjectURL(blob);
  $("sheetImg").src = url;
  $("sheet").classList.add("open");
});
$("sheetClose").addEventListener("click", () => {
  $("sheet").classList.remove("open");
  const src = $("sheetImg").src; if (src.startsWith("blob:")) URL.revokeObjectURL(src);
  $("sheetImg").removeAttribute("src");
});
$("sheet").addEventListener("click", e => { if (e.target === $("sheet")) $("sheetClose").click(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("sheet").classList.contains("open")) $("sheetClose").click(); });
